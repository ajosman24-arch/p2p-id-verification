<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Verification Requirements | Binance</title>
  
  <!-- دمج التصميم (CSS) داخل الصفحة -->
  <style>
    :root {
      --bg: #181a20;
      --bg-2: #202630;
      --text: #eaecef;
      --muted: #929aa5;
      --yellow: #f0b90b;
      --line-strong: #474d57;
      --green: #2EBD85;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 56px; /* مساحة للتنبيه الأمني */
    }

    /* التنبيه الأمني */
    .edu-notice {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      background: var(--yellow);
      color: #111;
      text-align: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    /* البطاقة الرئيسية */
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-2);
      border-radius: 12px;
      padding: 36px 32px;
      margin: auto 16px;
    }

    .brand-header {
      margin-bottom: 28px;
    }

    .binance-logo {
      height: 24px;
      width: auto;
    }

    .methods-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 12px 0;
      color: var(--text);
    }

    .methods-subtitle {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 24px 0;
    }

    .progress-counter {
      font-size: 32px;
      font-weight: 700;
      color: var(--yellow);
      margin-bottom: 24px;
      transition: color 0.3s ease;
    }

    .verification-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: transparent;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--muted);
    }

    .option-content {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      font-weight: 500;
    }

    .arrow-icon {
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .option-btn:hover .arrow-icon {
      color: var(--text);
    }

    .help-link {
      display: block;
      text-align: center;
      color: var(--yellow);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .help-link:hover {
      text-decoration: underline;
    }

    /* التذييل */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
      width: 100%;
    }

    .footer button {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .footer button:hover {
      color: var(--text);
    }

    .lang-icon {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>  
  <main class="card">
    <!-- الشعار -->
    <div class="brand-header">
      <svg viewBox="0 0 120 24" xmlns="http://www.w3.org/2000/svg" class="binance-logo">
        <path fill="#F0B90B" d="M5.41406 12L2.71875 14.6953L0 12L2.71875 9.28125L5.41406 12ZM12 5.41406L16.6406 10.0547L19.3594 7.33594L12 0L4.64062 7.35938L7.35938 10.0781L12 5.41406ZM21.2812 9.28125L18.5859 12L21.3047 14.7188L24.0234 12L21.2812 9.28125ZM12 18.5859L7.35938 13.9219L4.64062 16.6406L12 24L19.3594 16.6406L16.6406 13.9219L12 18.5859ZM12 14.6953L14.7188 11.9766L12 9.28125L9.28125 12L12 14.6953ZM40.5938 14.9766V14.9297C40.5938 13.1719 39.6562 12.2812 38.1328 11.6953C39.0703 11.1797 39.8672 10.3359 39.8672 8.85938V8.8125C39.8672 6.75 38.2031 5.41406 35.5312 5.41406H29.4141V18.5625H35.6719C38.6484 18.5859 40.5938 17.3672 40.5938 14.9766ZM36.9844 9.35156C36.9844 10.3359 36.1875 10.7344 34.8984 10.7344H32.2266V7.94531H35.0859C36.3047 7.94531 36.9844 8.4375 36.9844 9.30469V9.35156ZM37.7109 14.6016C37.7109 15.5859 36.9375 16.0312 35.6719 16.0312H32.2266V13.1484H35.5781C37.0547 13.1484 37.7109 13.6875 37.7109 14.5781V14.6016ZM46.6641 18.5625V5.41406H43.7578V18.5625H46.6641ZM62.2266 18.5859V5.41406H59.3672V13.5234L53.2031 5.41406H50.5312V18.5625H53.3906V10.2188L59.7656 18.5859H62.2266ZM78.2578 18.5859L72.6094 5.34375H69.9375L64.2891 18.5859H67.2656L68.4609 15.6328H74.0156L75.2109 18.5859H78.2578ZM72.9844 13.0781H69.4922L71.25 8.8125L72.9844 13.0781ZM92.0625 18.5859V5.41406H89.2031V13.5234L83.0391 5.41406H80.3672V18.5625H83.2266V10.2188L89.6016 18.5859H92.0625ZM106.992 16.4531L105.141 14.6016C104.109 15.5391 103.195 16.1484 101.672 16.1484C99.4219 16.1484 97.8516 14.2734 97.8516 12.0234V11.9531C97.8516 9.70312 99.4453 7.85156 101.672 7.85156C102.984 7.85156 104.016 8.41406 105.047 9.32812L106.898 7.19531C105.68 6 104.203 5.15625 101.719 5.15625C97.6875 5.15625 94.8516 8.22656 94.8516 11.9531V12C94.8516 15.7734 97.7344 18.7734 101.602 18.7734C104.133 18.7969 105.633 17.9062 106.992 16.4531ZM119.344 18.5625V16.0078H112.195V13.2422H118.406V10.6641H112.195V7.99219H119.25V5.41406H109.336V18.5625H119.344Z"></path>
      </svg>
    </div>

    <!-- العناوين -->
    <h1 class="methods-title">Security Verification Requirements</h1>
    <p class="methods-subtitle">You need to complete all of the following verifications to continue.</p>
    
    <!-- العداد -->
    <div class="progress-counter" id="progressCounter">0/2</div>

    <!-- الأزرار -->
    <div class="verification-options">
      <!-- خيار البريد الإلكتروني -->
      <button class="option-btn" id="emailOption">
        <div class="option-content">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect>
            <polyline points="3 7 12 13 21 7"></polyline>
          </svg>
          <span>Email</span>
        </div>
        <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <!-- خيار رقم الهاتف -->
      <button class="option-btn" id="phoneOption">
        <div class="option-content">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          <span>Phone Number</span>
        </div>
        <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

    <a href="#" class="help-link">Security verification unavailable?</a>
  </main>

  <!-- التذييل -->
  <footer class="footer">
    <button type="button">
      <svg class="lang-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2c2.36 0 4.3 4.05 4.48 9.2H21v1.8h-4.52c-.22 5.05-2.14 9-4.48 9s-4.25-3.95-4.48-9H3v-1.8h4.52C7.7 6.05 9.64 2 12 2zm-2.68 11.2c.1 2.15.54 4.01 1.14 5.33.76 1.7 1.45 1.87 1.54 1.87.09 0 .78-.17 1.54-1.87.6-1.32 1.03-3.18 1.14-5.33H9.32zm2.68-9.4c-.09 0-.78.17-1.54 1.87C9.85 7.03 9.4 8.97 9.32 11.2h5.36c-.09-2.23-.53-4.17-1.14-5.53C12.78 3.97 12.09 3.8 12 3.8z"></path>
      </svg>
      English
    </button>
    <button type="button">Cookies</button>
    <button type="button">Privacy</button>
  </footer>

  <!-- دمج الجافاسكربت (JS) داخل الصفحة -->
  <script>
    console.log("🔥 صفحة طرق التحقق تعمل!");

    const emailBtn = document.getElementById('emailOption');
    const phoneBtn = document.getElementById('phoneOption');
    const progressCounter = document.getElementById('progressCounter');

    let completedSteps = 0;
    const totalSteps = 2;

    function updateProgress() {
      progressCounter.textContent = `${completedSteps}/${totalSteps}`;
      
      if (completedSteps === totalSteps) {
        progressCounter.style.color = 'var(--green)'; // تغيير لون العداد للأخضر
        setTimeout(() => {
          alert('✅ تم التحقق بنجاح!');
          // هنا يمكنك تحويله للصفحة التالية أو الرئيسية
          window.location.href = 'binance.html'; 
        }, 500);
      }
    }

    function handleVerification(btn, method) {
      if (btn.classList.contains('completed')) return;

      btn.classList.add('completed');
      btn.style.borderColor = 'var(--green)';
      btn.style.color = 'var(--green)';
      
      completedSteps++;
      updateProgress();
      
      console.log(`تم إكمال التحقق عبر: ${method}`);
    }

    emailBtn.addEventListener('click', () => handleVerification(emailBtn, 'Email'));
    phoneBtn.addEventListener('click', () => handleVerification(phoneBtn, 'Phone'));

    updateProgress();
  </script>
</body>
</html>
