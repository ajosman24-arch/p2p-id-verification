  <script>
    const translations = {
      en: { title: "Get P2P ID", subtitle: "Click the button below to proceed to the login page and retrieve your P2P ID.", btn: "Get P2P ID", cookies: "Cookies", privacy: "Privacy", langText: "English" },

    };

    // قراءة اللغة المحفوظة أو استخدام الإنجليزية كافتراضي
    let currentLang = localStorage.getItem('siteLang') || 'en';

    function updateLang() {
      const t = translations[currentLang];
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      
      document.getElementById('txtTitle').textContent = t.title;
      document.getElementById('txtSubtitle').textContent = t.subtitle;
      document.getElementById('txtBtn').textContent = t.btn;
      document.getElementById('txtCookies').textContent = t.cookies;
      document.getElementById('txtPrivacy').textContent = t.privacy;
      document.getElementById('langToggleBtn').textContent = t.langText;
    }

    document.getElementById('langToggleBtn').addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      localStorage.setItem('siteLang', currentLang); // حفظ اللغة
      updateLang();
    });

    updateLang(); // تشغيل الترجمة عند فتح الصفحة
  </script>
